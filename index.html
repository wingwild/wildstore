<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wild Store - Coming Soon</title>
    <!-- Use Google Fonts to get a dense, bold font similar to the poster -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Warm Berry Brown Text Color */
            --text-color-berry: rgb(118, 51, 56);
            /* Cream Background Color */
            --bg-color-cream: rgb(255, 253, 208);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color-cream);
            color: var(--text-color-berry);
            font-family: 'Anton', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden; /* Prevent scrolling */
        }

        .column {
            display: flex;
            flex-direction: column;
            text-align: center;
            width: 100%; /* Ensure it spans the full width */
        }

        .stacked-text {
            font-weight: 700;
            /* Using 'vw' makes the text scale perfectly to the width of the screen */
            font-size: 8vw; 
            letter-spacing: -2px;
            line-height: 0.9; /* Keeps the text stacked tightly */
            margin: 0;
            text-transform: uppercase;
            white-space: nowrap; /* Forces the sentence to stay on one row */
        }

        /* Adjustments for mobile screens */
        @media (max-width: 768px) {
            .stacked-text {
                font-size: 11vw; /* Makes it slightly larger relative to mobile screens */
                letter-spacing: -1px;
            }
        }
    </style>
</head>
<body>
    <!-- Single Column Layout -->
    <div class="column">
        <div class="stacked-text">WILD STORE IS COMING!</div>
        <div class="stacked-text">WILD STORE IS COMING!</div>
        <div class="stacked-text">WILD STORE IS COMING!</div>
        <div class="stacked-text">WILD STORE IS COMING!</div>
        <div class="stacked-text">WILD STORE IS COMING!</div>
        <div class="stacked-text">WILD STORE IS COMING!</div>
        <div class="stacked-text">WILD STORE IS COMING!</div>
    </div>
</body>
</html>
